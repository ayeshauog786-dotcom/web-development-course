<!DOCTYPE html>
<html lang="en">
    <head>
        <title>My colour card</title>
        <style>

            /*Universal Selector - applies to everything on the page */
            *{font-size:16px}
            /* element selectors */
            body{background-color: lightgray;}
            h1{color: darkblue;}
            h2{color: purple;}
            p{color: dimgrey;}
            /*Class selector*/
            .my-detail{color: darkgreen;font-weight: bold;}
            /*ID selector */#my-card{background-color: lightcyan;}
        </style>
    </head>
    <body>

        <h1>My Color card</h1>

        <!-- Inline CSS: Add style="color:_______;" inside this p tag-->
         <p style="color: crimson;">Hi! This is my very own webpage.</p>
         <div id="my-card">
            <h2>about me</h2>
            <p class="my-detail">My name is Fatima.</p>
            <p class="my-detail">My favourite color is red.</p>
            <p class="my-detail">My favourite subjest is english.</p>
            <p class="my-detail">My favourite food is pasta.</p>
         </div>
         <h2>My favourite thins</h2>
         <p>My favourite animal is cat.</p>
         <p>My favourite sport is cricket.</p>
         <p>My favouritemovie is the lion king.</p>
    </body>
</html>
