<!DOCTYPE html>
<html>
    <head>
        <title>my animal fact file</title>
        <style>

            /*page background - sets the colour and font for the whole page */
            body {
                background-color: darkgreen;
                font-family: Arial, Helvetica, sans-serif;
            }

            /*box model - width sets the content area
            padding pushes the text away from the edges
            border draws a visible framearound the fact file
            margin pushes the fact file away from the screen edge */
            .fact-file {
                background-color: lightyellow;
                color: darkslategray;
                width: 260px;
                padding: 25px;
                border: 4px solid forestgreen;
                margin: 30px;
            }
            .animal name {
                color: forestgreen;
                font-size: 22px;
            }
            .detail {
                color: darkslategray;
            }
            .cool-fact {
                color: darkorange;
                font-style: italic;
            }
        </style>
    </head>
    <body>

        <div class="fact-file">
            <h2 class="animal-name">snow leopard</h2>
            <p class="detail">type: big cat</p>
            <p class="detail">lives in: mountain ranges of central asia </p>
            <p class="detail">diet: deer, goats, and wild sheeps</p>
            <p class="cool-fact">cool-fact: can leap up to 15 meters in one jump!</p>
        </div>
    </body>
</html>
