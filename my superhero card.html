<!DOCTYPE html>
<html>
    <head>
        <title>My Superhero card</title>
        <style>
            /* typography - font, size, weight, color for the whole page */
            body {
                background-color: darkblue;
                color: white;
                font-family: Arial, sans-serif;
            }

            /*typography + text shadow - big boldtitle withan orange shadow */
            .hero-name {
                font-size: 60px;
                font-weight: bold;
                color: yellow;
                text-shadow: 3px 3px orange ;
            }
            /* typography + text transform - tangeline becomes title case */
            .tagline {
                font-style: italic;
                color: lightblue;
                text-transform: capitalize;
            }

            /*text trasform + text decoration - section heading in CAPS with underline */
            .label {
                text-transform: uppercase;
                text-decoration: underline;
                color: coral;
            }

            /*typography - powers stand out in bold green */
            .power {
                font-weight: bold;
                color: lightgreen;
            }

            /*text decoration - weaknesses are crossed out */
            .weaknesses {
                text-decoration: line-through;
                color: grey;
            }

            /*transform - the badge is titled to the side */
            .badge {
                font-size: 28px;
                font-weight: bold;
                color: gold;
                transform: rotate(15deg);
            }

            /*typography - footer text */
            .made-by {
                color: coral;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1 class="hero-name">Thunder kid</h1>
        <p class="tagline">The most powerful hero in the school</p>

        <h2 class="label">super powers</h2>
        <p class="power">can run faster then a cheetah</p>
        <p class="power">can lift a school bus</p>

        <h2 class="label">weaknesses</h2>
        <p class="weaknesses">Maths homework</p>
        <p class="weaknesses">Broccoli</p>

        <p class="badge">top hero</p>

        <p class="made-by">created by Fatima</p>
    </body>
</html>
