<!DOCTYPE html>
<html>
    <head>
        <title>my book fact file</title>
        <style>


            /*page background */
            body {
                background-color: lavender;
                font-family: Arial, Helvetica, sans-serif;
            }

            .fact-file {
                background-color: white;
                color: darkslateblue;
                width: 260px;
                padding: 25px;
                border: 4px solid mediumpurple;
                margin: 30px;
            } 
            .book-name {
                color: purple;
                font-size: 22px;
            }
            .detail {
                color: darkslateblue;
            }
            .fun-fact {
                color: darkmagenta;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <div class="fact-file">

            <h2 class="book-name">harry potter</h2>

            <p class="detail">Genre: Fantasy</p>
            
            <p class="detail">Author: J.K.Rowling</p>

            <p class="detail">published: 1997</p>

            <p class="fun-fact">
                fun fact: The series has been translated into many languages!
            </p>
        </div>
    </body>
</html>
