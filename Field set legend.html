<!DOCTYPE html>
<html>
    <head>
        <title>fieldset</title>
    </head>
    <body>
        <form>
            <fieldset>
                <!--The fieldset tag is used t group related elements in a form and draws a box around them-->
                <legend>Personal information</legend>
                <label>Full name</label>
                <!--Placeholder attribute can be used to providse extra information about entry to be made-->
                <input type="text" id="fname" placeholder="Enter Name"><br><br>
                <label>Email:</label>
                <input type="text" id="email"><br><br>
                <label>Gender:</label><br>
                <input type="radio" id="male" name="gender" value="male">male<br>
                <input type="radio" id="female" name="gender" value="female">female<br><br>
                <label>Birthday:</label>
                <input type="date" id="birthday" name="birthday"><br><br>
            </fieldset>
        </form>
    </body>
</html>
